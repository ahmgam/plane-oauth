name: release-docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:

      - uses: actions/checkout@v7
        with:
          path: unlock-patch

      - name: Clone origin and apply patches
        run: |
          git config --global core.autocrlf false
          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/makeplane/plane.git
      - name: Apply patch
        run: |          
          cd plane
          git apply ${{ github.workspace }}/unlock-patch/generic-oauth.patch
      - name: Check status
        run: |  
          cd plane 
          git status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # sanad: ref=v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}


      - name: Build and push plane web Docker image
        id: build-plane-web
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./plane
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ahmgam/plane-web:${{ github.event.inputs.version }}

      - name: Build and push plane admin Docker image
        id: build-plane-admin
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./plane
          file: ./apps/admin/Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ahmgam/plane-admin:${{ github.event.inputs.version }}

      - name: Build and push plane space Docker image
        id: build-plane-space
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./plane
          file: ./apps/space/Dockerfile.space
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ahmgam/plane-space:${{ github.event.inputs.version }}

      - name: Build and push plane api Docker image
        id: build-plane-api
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./plane/apps/api
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ahmgam/plane-api:${{ github.event.inputs.version }}


      - name: Build and push plane live Docker image
        id: build-plane-live
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: ./plane
          file: ./apps/live/Dockerfile.live
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ahmgam/plane-live:${{ github.event.inputs.version }}